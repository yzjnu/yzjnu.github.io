<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微观粒子拼拼乐固定版（总分160）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #e8f5e9, #c8e6c9);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

h1 {
  font-size: 28px;
  color: #2e7d32;
  margin: 10px 0 5px;
}

.hint {
  font-size: 18px;
  color: #555;
  margin-bottom: 15px;
  text-align: center;
  background: rgba(255,255,255,0.8);
  padding: 8px 16px;
  border-radius: 10px;
}

/* 槽位区 */
.slots {
  display: flex;
  gap: 12px;
  margin: 20px 0;
  flex-wrap: wrap;
  justify-content: center;
}

.slot {
  width: 80px;
  height: 80px;
  border: 3px dashed #4CAF50;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: bold;
  background: rgba(255,255,255,0.9);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.slot.filled {
  border-style: solid;
  border-color: #2196F3;
  background: #e3f2fd;
}

.slot .sub {
  font-size: 20px;
  vertical-align: sub;
}

.slot .sup {
  font-size: 20px;
  vertical-align: super;
}

.slot-num {
  position: absolute;
  top: -10px;
  left: 4px;
  font-size: 12px;
  color: #999;
  font-weight: normal;
}

/* 积木池 */
.pool {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: center;
  margin: 20px 0;
  max-width: 500px;
}

.piece {
  width: 75px;
  height: 75px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.15s;
  user-select: none;
}

.piece:hover {
  transform: scale(1.1);
}

.piece:active {
  transform: scale(0.95);
}

.piece.selected {
  outline: 4px solid #FFD600;
  outline-offset: 2px;
}

.p-el { background: #2196F3; }
.p-num { background: #FF9800; }
.p-ch { background: #E91E63; }

/* 按钮 */
.btns {
  display: flex;
  gap: 12px;
  margin: 15px 0;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  font-size: 16px;
  padding: 10px 22px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.btn-check { background: #4CAF50; color: #fff; }
.btn-clear { background: #FF9800; color: #fff; }
.btn-hint { background: #9C27B0; color: #fff; }
.btn-next { background: #2196F3; color: #fff; }

/* 消息 */
.msg {
  margin-top: 15px;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
  max-width: 500px;
  min-height: 50px;
}

.msg.right { background: #c8e6c9; color: #2e7d32; }
.msg.wrong { background: #ffcdd2; color: #c62828; }
.msg.info { background: #e3f2fd; color: #1565c0; }

/* 分数 */
.score-bar {
  position: fixed;
  top: 10px;
  right: 20px;
  font-size: 16px;
  color: #333;
  background: rgba(255,255,255,0.9);
  padding: 6px 14px;
  border-radius: 20px;
}

/* 响应式 */
@media (min-width: 1000px) {
  h1 { font-size: 40px; }
  .hint { font-size: 24px; }
  .slot { width: 100px; height: 100px; font-size: 44px; }
  .piece { width: 90px; height: 90px; font-size: 40px; }
  button { font-size: 20px; padding: 14px 30px; }
  .msg { font-size: 22px; }
}
</style>
</head>
<body>

<div class="score-bar">⭐ 得分：<span id="score">0</span> / 160</div>

<h1>🧪 微观粒子拼拼乐固定版（共16关）</h1>
<div class="hint" id="hint"></div>

<div class="slots" id="slots"></div>

<div class="pool" id="pool"></div>

<div class="btns">
  <button class="btn-check" onclick="check()">✅ 检查答案</button>
  <button class="btn-clear" onclick="clearAll()">🔄 清空</button>
  <button class="btn-hint" onclick="showHint()">💡 提示</button>
  <button class="btn-next" onclick="nextLevel()">⏭ 下一关</button>
</div>

<div class="msg info" id="msg">点击下面的符号，再点击上面的空格来拼词</div>

<script>
const LEVELS = [
  { hint: '第1关：拼出 氢原子', answer: ['H'], cls: [''] },
  { hint: '第2关：拼出 氢气', answer: ['H','2'], cls: ['','sub'] },
  { hint: '第3关：拼出 3个氢分子', answer: ['3','H','2'], cls: ['','','sub'] },
  { hint: '第4关：拼出 氢离子', answer: ['H','+'], cls: ['','sup'] },
  { hint: '第5关：拼出 3个氢离子', answer: ['3','H','+'], cls: ['','','sup'] },
  { hint: '第6关：拼出 氧原子', answer: ['O'], cls: [''] },
  { hint: '第7关：拼出 氧气', answer: ['O','2'], cls: ['','sub'] },
  { hint: '第8关：拼出 3个氧分子', answer: ['3','O','2'], cls: ['','','sub'] },
  { hint: '第9关：拼出 氧离子', answer: ['O','2','-'], cls: ['','sup','sup'] },
  { hint: '第10关：拼出 3个氧离子', answer: ['3','O','2','-'], cls: ['','','sup','sup'] },
  { hint: '第11关：拼出 水', answer: ['H','2','O'], cls: ['','sub',''] },
  { hint: '第12关：拼出 3个水分子', answer: ['3','H','2','O'], cls: ['','','sub',''] },
  { hint: '第13关：拼出 过氧化氢', answer: ['H','2','O','2'], cls: ['','sub','','sub'] },
  { hint: '第14关：拼出 3个过氧化氢分子', answer: ['3','H','2','O','2'], cls: ['','','sub','','sub'] },
  { hint: '第15关：拼出氢氧根', answer: ['O','H','-'], cls: ['','','sup'] },
  { hint: '第16关：拼出3个氢氧根', answer: ['3','O','H','-'], cls: ['','','','sup'] },
];

const POOL = [
  {id:1, char:'H', type:'el'},
  {id:2, char:'O', type:'el'},
  {id:3, char:'2', type:'num'},
  {id:4, char:'3', type:'num'},
  {id:5, char:'+', type:'ch'},
  {id:6, char:'-', type:'ch'},
];

let currentLevel = 0;
let slots = [];
let selectedPiece = null;
let score = 0;
let levelPassed = false;
let wrongCount = 0;
let scoreLocked = false;

function init() {
  loadLevel(currentLevel);
  renderPool();
}

function loadLevel(idx) {
  const lv = LEVELS[idx];
  slots = lv.answer.map(() => ({ char: '', cls: '' }));
  selectedPiece = null;
  levelPassed = false;
  wrongCount = 0;
 scoreLocked = false;
  document.getElementById('hint').textContent = lv.hint;
  setMsg('点击下面的符号，再点击上面的空格来拼词', 'info');
  renderSlots();
}

function renderSlots() {
  const container = document.getElementById('slots');
  container.innerHTML = '';
  slots.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slot' + (s.char ? ' filled' : '');
    div.onclick = () => fillSlot(i);

    const num = document.createElement('span');
    num.className = 'slot-num';
    num.textContent = i + 1;
    div.appendChild(num);

    if (s.char) {
      const span = document.createElement('span');
      span.textContent = s.char;
      span.className = s.cls;
      div.appendChild(span);
    } else {
      const ph = document.createElement('span');
      ph.textContent = '?';
      ph.style.color = '#bbb';
      ph.style.fontSize = '28px';
      div.appendChild(ph);
    }
    container.appendChild(div);
  });
}

function renderPool() {
  const container = document.getElementById('pool');
  container.innerHTML = '';
  POOL.forEach(p => {
    const div = document.createElement('div');
    div.className = 'piece p-' + p.type + (selectedPiece === p.id ? ' selected' : '');
    div.textContent = p.char;
    div.onclick = () => selectPiece(p.id);
    container.appendChild(div);
  });
}

function selectPiece(id) {
  selectedPiece = (selectedPiece === id) ? null : id;
  renderPool();
  const p = POOL.find(x => x.id === id);
  if (p && selectedPiece) {
    setMsg('已选 "' + p.char + '"，现在点击上面的空格', 'info');
  }
}

function fillSlot(idx) {
  if (!selectedPiece) {
    setMsg('⚠️ 先点下面的符号！', 'wrong');
    return;
  }
  const p = POOL.find(x => x.id === selectedPiece);
  if (!p) return;

  const lv = LEVELS[currentLevel];
  slots[idx] = { char: p.char, cls: lv.cls[idx] || '' };
  selectedPiece = null;
  renderSlots();
  renderPool();
}

function clearAll() {
  slots = slots.map(() => ({ char: '', cls: '' }));
  selectedPiece = null;
  levelPassed = false;
  wrongCount = 0;
  scoreLocked = false;
  renderSlots();
  renderPool();
  setMsg('已清空，重新拼吧！', 'info');
}

function check() {
  const user = slots.map(s => s.char).join('');
  const ans = LEVELS[currentLevel].answer.join('');

  if (user === ans) {
    if (!scoreLocked) {
      score += 10;
      document.getElementById('score').textContent = score;
      setMsg('🎉 正确！+10分　答案：' + ans, 'right');
    } else {
      setMsg('✅ 拼对了，但之前答错过，本关不得分。答案：' + ans, 'right');
    }
    levelPassed = true;
  } else if (user.length < ans.length) {
    setMsg('还有 ' + (ans.length - user.length) + ' 个空没填呢', 'wrong');
  } else {
    scoreLocked = true;  // ← 答错一次，永久锁分
    wrongCount++;
    if (wrongCount >= 3) {
      setMsg('😅 已错3次，正确答案是 "' + ans + '"，自动进入下一关', 'wrong');
      levelPassed = true;
      setTimeout(() => { nextLevel(); }, 2500);
    } else {
      setMsg('❌ 答错！本关分数已锁定，改对也不给分。（还剩' + (3 - wrongCount) + '次机会）', 'wrong');
    }
  }
}

function showHint() {
  const lv = LEVELS[currentLevel];
  let tip = '提示：';
  lv.answer.forEach((c, i) => {
    const style = lv.cls[i];
    if (style === 'sub') tip += c + '(右下角) ';
    else if (style === 'sup') tip += c + '(右上角) ';
    else tip += c + ' ';
  });
  setMsg(tip, 'info');
}

function nextLevel() {
  if (!levelPassed) {
    setMsg('🔒 还没答对呢，先拼对才能进下一关！', 'wrong');
    return;
  }

  currentLevel++;
  if (currentLevel >= LEVELS.length) {
   setMsg('🏆 全部通关！得分：' + score + ' / 160　刷新页面重来', 'right');
    currentLevel = 0;
    score = 0;
    document.getElementById('score').textContent = score;
  }
  loadLevel(currentLevel);
}

function setMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

// 启动
init();
</script>
</body>
</html>
